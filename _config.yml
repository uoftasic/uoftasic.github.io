# UofT ASIC — site configuration
#
# GitHub Pages builds this repo with its built-in Jekyll builder (Pages
# build_type "legacy", branch master). That constrains us to Jekyll 3.x and the
# plugins Pages whitelists — see the Gemfile. Everything here is core Jekyll or
# a whitelisted plugin, so `bundle exec jekyll build` locally and the Pages
# build produce the same site.
#
# NOTE: this file is NOT reloaded by `jekyll serve`. Restart after editing.

title: UofT ASIC
email: team@uoftasic.com
description: >-
  Undergraduates at the University of Toronto who design, verify and tape out
  integrated circuits, working entirely in the open-source flow.
url: "https://uoftasic.com"
baseurl: ""
github_username: uoftasic
lang: en
timezone: America/Toronto

# Used by the masthead, footer and structured data.
organisation:
  short_name: UofT ASIC
  full_name: UofT ASIC Team
  institution: University of Toronto
  tagline: Undergraduate IC design
  discord: https://discord.gg/hrJnP5UsGz
  events: https://lu.ma/uoft-asic
  instagram: https://www.instagram.com/uoftasic
  github: https://github.com/uoftasic
  membership_form: https://docs.google.com/forms/d/e/1FAIpQLSfcVjaUK3G8a9eFQeG-YlMoNPaecRLAIPZiuMQzkatFe4FCpQ/viewform?usp=publish-editor

# Author block consumed by jekyll-seo-tag.
author:
  name: UofT ASIC Team
  email: team@uoftasic.com

social:
  name: UofT ASIC Team
  links:
    - https://github.com/uoftasic
    - https://www.instagram.com/uoftasic

# With no theme declared the github-pages gem silently falls back to
# jekyll-theme-primer and starts injecting its layouts and assets. This site
# owns every layout and include, so opt out explicitly.
theme: null

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  # Leave LaTeX delimiters untouched. kramdown's default engine rewrites math
  # into <script type="math/tex">, which KaTeX's auto-render cannot see, so
  # authors would write valid LaTeX and get nothing. See _includes/math.html.
  math_engine: nil

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji

# Projects are a collection, not posts: a project is a living thing with a
# status that advances, whereas a post is dated and then frozen.
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Posts keep their existing public URLs. They previously reached /blog/... via a
# "Blog" category plus a /:categories/:title/ permalink; setting the prefix here
# instead means the same URLs without every post carrying a redundant category.
permalink: /blog/:title/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.ts
  - tests
  - README.md
  - "*.code-workspace"
  # An internal document, not a page. Left in the repo but kept out of the
  # build, where it was being rendered to a URL containing spaces.
  - "assets/UofT ASIC Sponsorship Package.md"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
