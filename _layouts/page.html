---
layout: default
---
<article class="shell">
  <header class="pagehead">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
